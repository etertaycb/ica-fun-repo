<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1026" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Neon Runner</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; overflow:hidden; background:#0b1026;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color:#eaf2ff; user-select:none; -webkit-user-select:none; touch-action:none;
  }
  #game { display:block; width:100vw; height:100vh; height:100dvh; touch-action:none; }

  /* faint control hints (mostly invisible) */
  #hints { position:fixed; inset:0; z-index:4; pointer-events:none; }
  #hints div {
    position:absolute; display:flex; align-items:center; justify-content:center;
    font-size:13px; letter-spacing:2px; color:#fff; opacity:.14;
    font-weight:700; transition:opacity .3s;
  }
  #hLeft  { left:0;  top:0; width:50%; height:74%; }
  #hRight { right:0; top:0; width:50%; height:74%; }
  #hJump  { left:0;  bottom:0; width:100%; height:26%;
            border-top:1px dashed rgba(255,255,255,.12); }
  #hints.fade div { opacity:0; }

  .overlay {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px; gap:16px;
    background:radial-gradient(120% 90% at 50% 0%, rgba(39,225,193,.12), transparent 60%);
    transition:opacity .25s ease;
  }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .title {
    font-size:clamp(38px,12vw,84px); font-weight:800; letter-spacing:2px; margin:0; line-height:1;
    background:linear-gradient(90deg,#27e1c1,#ff5d8f); -webkit-background-clip:text;
    background-clip:text; color:transparent; text-shadow:0 0 30px rgba(39,225,193,.35);
  }
  .sub { font-size:clamp(14px,4.3vw,19px); opacity:.85; max-width:330px; line-height:1.55; margin:0; }
  .btn {
    appearance:none; border:none; cursor:pointer; padding:16px 40px; font-size:20px; font-weight:700;
    color:#04121a; border-radius:999px; background:linear-gradient(90deg,#27e1c1,#6ef0d8);
    box-shadow:0 8px 30px rgba(39,225,193,.45); transition:transform .08s ease;
  }
  .btn:active { transform:scale(.95); }
  .legend { font-size:13px; opacity:.6; line-height:1.7; }
  .pill { display:inline-block; padding:4px 14px; border-radius:999px;
          border:1px solid rgba(255,255,255,.18); font-size:13px; opacity:.8; }
  #hud { position:fixed; top:env(safe-area-inset-top,12px); left:0; right:0; z-index:5;
         padding:12px 16px 0; display:flex; justify-content:space-between;
         font-size:18px; font-weight:700; pointer-events:none; text-shadow:0 0 12px rgba(0,0,0,.6); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" style="opacity:0" >
  <span id="coinHud">★ 0</span>
  <span id="timeHud">0.0s</span>
</div>

<div id="hints"><div id="hLeft">◀ LEFT</div><div id="hRight">RIGHT ▶</div><div id="hJump">▲ JUMP</div></div>

<div class="overlay" id="startScreen">
  <span class="pill">touch platformer</span>
  <h1 class="title">NEON<br>RUNNER</h1>
  <p class="sub">Reach the goal flag and grab the stars!</p>
  <div class="legend">
    Left half of screen → move left<br>
    Right half → move right<br>
    Bottom band → jump (tap again in air to double-jump)
  </div>
  <button class="btn" id="startBtn">START</button>
</div>

<div class="overlay hidden" id="winScreen">
  <h1 class="title">YOU WIN!</h1>
  <p class="sub" id="winText"></p>
  <button class="btn" id="retryBtn">PLAY AGAIN</button>
</div>

<script>
(function () {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const startScreen = document.getElementById("startScreen");
  const winScreen = document.getElementById("winScreen");
  const winText = document.getElementById("winText");
  const hud = document.getElementById("hud");
  const coinHud = document.getElementById("coinHud");
  const timeHud = document.getElementById("timeHud");
  const hints = document.getElementById("hints");

  let W = 0, H = 0, DPR = 1, SCALE = 1;
  const DESIGN_H = 800; // world units tall = one screen
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    SCALE = H / DESIGN_H;            // world unit -> screen px
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Level (world units, y goes down) ----------
  // ground at y=700, world from x=0 to x=GOAL
  const platforms = [
    { x:-100, y:700, w:900, h:200 },
    { x:980, y:700, w:600, h:200 },
    { x:1760,y:700, w:1400,h:200 },
    // floating platforms
    { x:520, y:560, w:200, h:36 },
    { x:760, y:440, w:200, h:36 },
    { x:1040,y:520, w:170, h:36 },
    { x:1280,y:420, w:170, h:36 },
    { x:1500,y:560, w:180, h:36 },
    { x:2050,y:560, w:200, h:36 },
    { x:2320,y:440, w:200, h:36 },
    { x:2600,y:540, w:240, h:36 },
  ];
  const coinDefs = [
    {x:600,y:500},{x:840,y:380},{x:1120,y:460},{x:1360,y:360},
    {x:1580,y:500},{x:2130,y:500},{x:2400,y:380},{x:2700,y:480},
    {x:300,y:640},{x:1840,y:640},
  ];
  const GOAL_X = 3050, GOAL_Y = 700;
  const SPAWN = { x: 120, y: 600 };

  let player, coins, cam, coinCount, startTime, elapsed, particles, won, deaths;

  function reset() {
    player = { x:SPAWN.x, y:SPAWN.y, w:46, h:60, vx:0, vy:0,
               onGround:false, coyote:0, jumps:0, face:1, anim:0 };
    coins = coinDefs.map(c => ({ x:c.x, y:c.y, got:false, t:Math.random()*6.28 }));
    cam = { x:0 };
    coinCount = 0; elapsed = 0; won = false; deaths = 0;
    particles = [];
    startTime = performance.now();
  }

  function start() {
    reset();
    startScreen.classList.add("hidden");
    winScreen.classList.add("hidden");
    hud.style.opacity = "1";
    hints.classList.remove("fade");
    // fade the control hints away after a few seconds
    setTimeout(() => hints.classList.add("fade"), 4000);
    running = true;
  }
  let running = false;

  function win() {
    won = true; running = false;
    hud.style.opacity = "0";
    winText.innerHTML = "Time: <b style='color:#27e1c1'>" + elapsed.toFixed(1) + "s</b>" +
      "<br>Stars: <b style='color:#ffd84d'>" + coinCount + "/" + coins.length + "</b>" +
      (deaths === 0 ? "<br><span style='color:#27e1c1'>★ Flawless — no falls!</span>" : "");
    winScreen.classList.remove("hidden");
  }

  function burst(x, y, color, n, spread) {
    spread = spread || 4;
    for (let i=0;i<n;i++){
      const a=Math.random()*6.283, sp=Math.random()*spread+1;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,
                      s:Math.random()*3+2,color});
    }
  }

  // ---------- Multitouch controls (invisible zones) ----------
  // pointers tracked by id; each frame we read their positions to set held state.
  const pointers = new Map();
  let jumpQueued = false;

  function zoneOf(px, py) {
    if (py >= H * 0.74) return "jump";          // bottom band
    return px < W * 0.5 ? "left" : "right";
  }
  function onDown(e) {
    for (const t of (e.changedTouches || [e])) {
      const id = t.identifier !== undefined ? t.identifier : "mouse";
      const x = t.clientX, y = t.clientY;
      pointers.set(id, { x, y });
      if (zoneOf(x, y) === "jump") jumpQueued = true;  // edge-trigger jump
    }
    if (running) e.preventDefault();
  }
  function onMove(e) {
    for (const t of (e.changedTouches || [e])) {
      const id = t.identifier !== undefined ? t.identifier : "mouse";
      if (pointers.has(id)) pointers.set(id, { x:t.clientX, y:t.clientY });
    }
    if (running) e.preventDefault();
  }
  function onUp(e) {
    for (const t of (e.changedTouches || [e])) {
      const id = t.identifier !== undefined ? t.identifier : "mouse";
      pointers.delete(id);
    }
  }
  // Touch events (multitouch) + mouse fallback for desktop testing
  canvas.addEventListener("touchstart", onDown, { passive:false });
  canvas.addEventListener("touchmove",  onMove, { passive:false });
  canvas.addEventListener("touchend",   onUp,   { passive:false });
  canvas.addEventListener("touchcancel",onUp,   { passive:false });
  let mouseDown = false;
  canvas.addEventListener("mousedown", e => { mouseDown = true; onDown(e); });
  canvas.addEventListener("mousemove", e => { if (mouseDown) onMove(e); });
  window.addEventListener("mouseup",   e => { mouseDown = false; onUp({changedTouches:[{identifier:"mouse"}]}); });

  // keyboard for desktop
  const keys = {};
  window.addEventListener("keydown", e => {
    keys[e.code] = true;
    if (e.code === "Space" || e.code === "ArrowUp") { jumpQueued = true; e.preventDefault(); }
    if (e.code === "Enter" && !running) start();
  });
  window.addEventListener("keyup", e => { keys[e.code] = false; });

  function readControls() {
    let left = false, right = false;
    for (const p of pointers.values()) {
      const z = zoneOf(p.x, p.y);
      if (z === "left") left = true;
      else if (z === "right") right = true;
    }
    if (keys["ArrowLeft"] || keys["KeyA"]) left = true;
    if (keys["ArrowRight"]|| keys["KeyD"]) right = true;
    return { left, right };
  }

  document.getElementById("startBtn").addEventListener("click", start);
  document.getElementById("retryBtn").addEventListener("click", start);

  // ---------- Physics ----------
  const GRAV = 0.9, MOVE = 1.4, FRICTION = 0.78, MAXVX = 9,
        JUMP_V = -17, COYOTE = 8;

  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update() {
    if (!running) { updateParticles(); return; }
    elapsed = (performance.now() - startTime) / 1000;
    const c = readControls();

    // horizontal
    if (c.left)  { player.vx -= MOVE; player.face = -1; }
    if (c.right) { player.vx += MOVE; player.face = 1; }
    if (!c.left && !c.right) player.vx *= FRICTION;
    player.vx = Math.max(-MAXVX, Math.min(MAXVX, player.vx));
    if (Math.abs(player.vx) < 0.05) player.vx = 0;

    // jump (with coyote + double jump)
    if (jumpQueued) {
      if (player.onGround || player.coyote > 0) {
        player.vy = JUMP_V; player.jumps = 1; player.onGround = false; player.coyote = 0;
        burst(player.x+player.w/2, player.y+player.h, "#27e1c1", 8, 3);
      } else if (player.jumps < 2) {
        player.vy = JUMP_V * 0.88; player.jumps = 2;
        burst(player.x+player.w/2, player.y+player.h/2, "#6ef0d8", 10, 4);
      }
    }
    jumpQueued = false;

    player.vy += GRAV;
    if (player.vy > 24) player.vy = 24;

    // move X then resolve
    player.x += player.vx;
    for (const p of platforms) {
      if (aabb(player, p)) {
        if (player.vx > 0) player.x = p.x - player.w;
        else if (player.vx < 0) player.x = p.x + p.w;
        player.vx = 0;
      }
    }
    // move Y then resolve
    player.y += player.vy;
    let grounded = false;
    for (const p of platforms) {
      if (aabb(player, p)) {
        if (player.vy > 0) { player.y = p.y - player.h; grounded = true; }
        else if (player.vy < 0) { player.y = p.y + p.h; }
        player.vy = 0;
      }
    }
    if (grounded) { player.onGround = true; player.jumps = 0; player.coyote = COYOTE; }
    else { player.onGround = false; if (player.coyote > 0) player.coyote--; }

    if (player.x < -50) { player.x = -50; player.vx = 0; }

    // anim
    if (Math.abs(player.vx) > 0.5) player.anim += 0.25;

    // fell off
    if (player.y > DESIGN_H + 200) {
      deaths++;
      burst(player.x+player.w/2, DESIGN_H, "#ff5d8f", 20, 5);
      player.x = SPAWN.x; player.y = SPAWN.y; player.vx = 0; player.vy = 0;
    }

    // coins
    for (const co of coins) {
      if (co.got) continue;
      co.t += 0.12;
      const cx = co.x, cy = co.y + Math.sin(co.t)*6;
      if (Math.abs((player.x+player.w/2)-cx) < 34 && Math.abs((player.y+player.h/2)-cy) < 40) {
        co.got = true; coinCount++;
        coinHud.textContent = "★ " + coinCount;
        burst(cx, cy, "#ffd84d", 14, 4);
      }
    }

    // goal
    const goal = { x:GOAL_X, y:GOAL_Y-160, w:60, h:160 };
    if (aabb(player, goal)) { burst(GOAL_X, GOAL_Y-160, "#27e1c1", 40, 6); win(); }

    timeHud.textContent = elapsed.toFixed(1) + "s";

    // camera follows player, clamped to level start
    const target = player.x + player.w/2 - (W / SCALE) * 0.42;
    cam.x += (target - cam.x) * 0.12;
    if (cam.x < 0) cam.x = 0;

    updateParticles();
  }

  function updateParticles() {
    for (let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.life-=0.025;
      if (p.life<=0) particles.splice(i,1);
    }
  }

  // ---------- Render ----------
  function wx(x){ return (x - cam.x) * SCALE; }      // world x -> screen
  function wy(y){ return y * SCALE; }
  function ws(v){ return v * SCALE; }

  function render() {
    // sky
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#11183a"); g.addColorStop(1,"#080a1d");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // parallax hills
    for (let layer=0; layer<2; layer++) {
      const k = layer===0 ? 0.25 : 0.5;
      ctx.fillStyle = layer===0 ? "rgba(39,225,193,0.06)" : "rgba(255,93,143,0.06)";
      const baseY = H * (layer===0 ? 0.62 : 0.72);
      ctx.beginPath(); ctx.moveTo(0,H);
      for (let sx=0; sx<=W+80; sx+=80) {
        const wxp = (sx + cam.x*SCALE*k) * 0.02;
        ctx.lineTo(sx, baseY + Math.sin(wxp+layer)*40);
      }
      ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    }

    // platforms
    for (const p of platforms) {
      const x = wx(p.x), y = wy(p.y), w = ws(p.w), h = ws(p.h);
      if (x+w < -40 || x > W+40) continue;
      ctx.fillStyle = "#1d2a55";
      ctx.fillRect(x, y, w, h);
      // neon top
      ctx.fillStyle = "#27e1c1";
      ctx.shadowColor = "rgba(39,225,193,0.8)"; ctx.shadowBlur = 16;
      ctx.fillRect(x, y, w, Math.max(4, ws(6)));
      ctx.shadowBlur = 0;
    }

    // coins (stars)
    for (const co of coins) {
      if (co.got) continue;
      const cx = wx(co.x), cy = wy(co.y + Math.sin(co.t)*6);
      if (cx < -40 || cx > W+40) continue;
      drawStar(cx, cy, ws(15), "#ffd84d");
    }

    // goal flag
    const gx = wx(GOAL_X), gy = wy(GOAL_Y);
    if (gx > -80 && gx < W+80) {
      ctx.strokeStyle = "#eaf2ff"; ctx.lineWidth = Math.max(3, ws(5));
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy - ws(160)); ctx.stroke();
      ctx.fillStyle = "#ff5d8f"; ctx.shadowColor="rgba(255,93,143,.7)"; ctx.shadowBlur=14;
      ctx.beginPath();
      ctx.moveTo(gx, gy - ws(160));
      ctx.lineTo(gx + ws(70), gy - ws(140));
      ctx.lineTo(gx, gy - ws(118));
      ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(wx(p.x), wy(p.y), ws(p.s), 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // player
    drawPlayer();
  }

  function drawStar(cx, cy, r, color) {
    ctx.save(); ctx.translate(cx, cy);
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 14;
    ctx.beginPath();
    for (let i=0;i<10;i++){
      const ang = -Math.PI/2 + i*Math.PI/5;
      const rr = i%2===0 ? r : r*0.45;
      ctx.lineTo(Math.cos(ang)*rr, Math.sin(ang)*rr);
    }
    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0; ctx.restore();
  }

  function drawPlayer() {
    const x = wx(player.x), y = wy(player.y), w = ws(player.w), h = ws(player.h);
    const bob = player.onGround ? Math.sin(player.anim)*ws(2) : 0;
    ctx.save();
    ctx.translate(x + w/2, y + h/2 + bob);
    ctx.scale(player.face, 1);
    // body
    ctx.fillStyle = "#27e1c1"; ctx.shadowColor="rgba(39,225,193,.9)"; ctx.shadowBlur=20;
    roundRect(-w/2, -h/2, w, h, ws(12)); ctx.fill();
    ctx.shadowBlur = 0;
    // visor
    ctx.fillStyle = "#04121a";
    roundRect(w*0.02, -h*0.28, w*0.34, h*0.22, ws(6)); ctx.fill();
    // eye glow
    ctx.fillStyle = "#ff5d8f";
    ctx.beginPath(); ctx.arc(w*0.2, -h*0.17, ws(4), 0, 6.283); ctx.fill();
    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function loop(){ update(); render(); requestAnimationFrame(loop); }
  reset(); loop();
})();
</script>
</body>
</html>
